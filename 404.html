<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


.error-container {
    text-align: center;
}

.error-container h1 {
    font-size: 8rem;
    margin: 0;
    color: #ff6b6b;
    font-family: 'Geist Mono', monospace;
}

.error-container p {
    font-size: 1.5rem;
    margin: 20px 0;
}

.back-home {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 1rem;
    color: #fff;
    background-color: #007bff;
    text-decoration: none;
    border-radius: 5px;
    transition: background-color 0.3s ease;
    cursor: pointer;
    font-family: 'Geist Mono', monospace;
}

.back-home:hover {
    background-color: #0056b3;
}

</style>
<body>
    <div class="error-container">
        <h1>404 Error</h1>
        <p id="error-message">Oops! The page you're looking for doesn't exist.</p>
        <a class="back-home" onclick="goBack()">Back</a>
    </div>
</body>
<script src="Javascript.js"></script>
<button class="buttonhide" id="theme-toggle" style="border: none; background: none; padding: 0; overflow: hidden;">
    <img class="theme-toggle" id="theme-icon" src="light.png" alt="Toggle Theme" height="75" width="75" style="display: block;">
</button>
<script>
    function goBack() {
        window.history.back();
    }
    const params = new URLSearchParams(window.location.search);
    const missingFile = window.location.pathname.split('/').pop();
    const errorMessage = document.getElementById('error-message');
    errorMessage.textContent = `Oops! The page "${missingFile}" wasn’t found. Please contact ender1992 on Discord if this issue persists.`;
</script>
</html>
